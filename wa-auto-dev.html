<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WhatsApp 自动开发工具 - JunlinChicheng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1b2a;color:#e2e8f0;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:20px}
h1{color:#25d366;font-size:22px;margin-bottom:4px}
.subtitle{color:#94a3b8;font-size:13px;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:#1e293b;border-radius:10px;padding:16px;text-align:center;border:1px solid #334155}
.stat-num{font-size:28px;font-weight:800;color:#25d366}
.stat-label{font-size:11px;color:#94a3b8;margin-top:4px}
.card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;margin-bottom:16px}
.card h3{font-size:15px;color:#f8fafc;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-weight:700;font-size:14px;border:none;cursor:pointer;margin:4px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-green{background:#25d366;color:#000}
.btn-blue{background:#1a5276;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-orange{background:#ea580c;color:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.target-table{width:100%;border-collapse:collapse}
.target-table th{background:#0f172a;padding:10px 12px;font-size:11px;text-align:left;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.target-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #334155;vertical-align:middle}
.target-table tr:hover{background:rgba(255,255,255,.02)}
.priority-high{color:#f87171;font-weight:600}
.priority-medium{color:#fbbf24}
.phone-input{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:6px 10px;color:#e2e8f0;font-size:13px;width:160px;font-family:inherit}
.phone-input:focus{outline:none;border-color:#25d366}
.btn-wa{background:#25d366;color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-wa:hover{opacity:.85}
.btn-copy{background:rgba(255,255,255,.08);color:#94a3b8;border:none;border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;margin-left:4px}
.btn-copy:hover{background:rgba(255,255,255,.15);color:white}
.btn-search{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.25);border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;margin-left:4px}
.btn-search:hover{background:rgba(96,165,250,.2)}
.status-open{background:#1e3a5f;color:#60a5fa;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-sent{background:#065f46;color:#34d399;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.status-pending{background:#334155;color:#94a3b8;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.progress-bar{height:6px;background:#334155;border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#25d366,#128c7e);border-radius:3px;transition:width .3s}
.log{background:#0f172a;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;color:#94a3b8;max-height:150px;overflow-y:auto;margin-top:12px}
.log-entry{margin-bottom:3px}
.log-ok{color:#34d399}.log-err{color:#f87171}.log-warn{color:#fbbf24}
.template-box{background:#0f172a;border-radius:8px;padding:12px;font-size:12px;color:#94a3b8;line-height:1.6;margin:8px 0;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.send-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,27,42,.97);backdrop-filter:blur(10px);border-top:1px solid #334155;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.send-bar span{font-size:13px;color:#94a3b8}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container" style="padding-bottom:80px">
<h1>📱 WhatsApp 自动开发工具</h1>
<p class="subtitle">JunlinChicheng Metal Products Group — 太阳能电池电缆 B2B 开发</p>

<div class="stats">
<div class="stat"><div class="stat-num" id="totalCount">20</div><div class="stat-label">目标公司</div></div>
<div class="stat"><div class="stat-num" id="phoneCount">0</div><div class="stat-label">已填号码</div></div>
<div class="stat"><div class="stat-num" id="openCount">0</div><div class="stat-label">已打开</div></div>
<div class="stat"><div class="stat-num" id="sentCount">0</div><div class="stat-label">已发送</div></div>
</div>

<div class="card">
<h3>⚡ 自动搜索 & 打开流程</h3>
<p style="font-size:13px;color:#94a3b8;margin-bottom:12px">点击下方按钮，自动按顺序打开每个公司的联系方式搜索页面。</p>
<p style="font-size:12px;color:#64748b;margin-bottom:12px">在搜索结果中找到公司的 WhatsApp/电话 → 填入下方表格 → 点击 WhatsApp 发送开发信。</p>
<button class="btn btn-green" id="autoOpenBtn" onclick="startAutoOpen()">▶ Start Auto Open</button>
<button class="btn btn-blue" onclick="openAllSearches()">🔍 全部打开搜索</button>
<button class="btn btn-orange" onclick="exportContacts()">📥 导出联系人</button>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="log" id="log"></div>
</div>

<div class="card">
<h3>💬 消息模板</h3>
<select id="templateSelect" onchange="updateTemplate()" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:8px 12px;color:#e2e8f0;font-size:13px;margin-bottom:8px">
<option value="auto">🔄 按地区自动选择</option>
<option value="south_africa">🇿🇦 南非</option>
<option value="nigeria">🇳🇬 尼日利亚</option>
<option value="saudi">🇸🇦 沙特</option>
<option value="uae">🇦🇪 阿联酋</option>
<option value="kenya">🇰🇪 肯尼亚</option>
<option value="india">🇮🇳 印度</option>
<option value="brazil">🇧🇷 巴西</option>
<option value="pakistan">🇵🇰 巴基斯坦</option>
<option value="custom">✏️ 自定义</option>
</select>
<textarea id="customTemplate" class="phone-input" style="width:100%;min-height:80px;resize:vertical;display:none" placeholder="输入自定义消息..."></textarea>
<div class="template-box" id="templatePreview"></div>
</div>

<div class="card">
<h3>🎯 目标公司列表 (20)</h3>
<table class="target-table">
<thead><tr><th>公司</th><th>国家</th><th>类型</th><th>优先级</th><th>联系方式</th><th>搜索</th><th>WhatsApp</th><th>状态</th></tr></thead>
<tbody id="targetBody"></tbody>
</table>
</div>
</div>

<div class="send-bar">
<span id="barStatus">准备就绪 — 点击 "Start Auto Open" 开始</span>
<div>
<button class="btn btn-green" style="padding:8px 16px;font-size:13px" onclick="startAutoOpen()">▶ 开始自动开发</button>
</div>
</div>

<script>
const WA_NUMBER='8615339005193';
const COMPANY='JunlinChicheng Metal Products Group Co., Ltd.';
const WEBSITE='https://xxy13992859166-ops.github.io/suncable-website/';

const TEMPLATES={
  south_africa:`Hello! This is JunlinChicheng from China. We are a TUV & UL certified manufacturer of solar PV cables (PV1-F, H1Z2Z2-K), MC4 connectors, and complete solar energy system components. We supply to 50+ countries.\n\nCould you share your current cable requirements? We'd love to quote competitively.\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193\n📧 xxy13992859166@gmail.com\n🌐 ${WEBSITE}`,
  nigeria:`Good day! This is JunlinChicheng Metal Products Group from China. We manufacture TUV & UL certified solar PV cables and MC4 connectors for the African market.\n\nWe have extensive experience supplying to Nigerian solar projects. May I send you our catalog and pricing?\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193\n📧 xxy13992859166@gmail.com`,
  saudi:`Hello, this is JunlinChicheng from China. We are a TUV and UL certified manufacturer specializing in PV solar cables (PV1-F 2-core, H1Z2Z2-K single core), MC4 connectors, and complete solar balance-of-system components.\n\nWe supply to 50+ countries including GCC markets. Would you be interested in a competitive quotation?\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193\n📧 xxy13992859166@gmail.com`,
  uae:`Hello! This is JunlinChicheng Metal Products Group from China. We manufacture TUV & UL certified solar PV cables and MC4 connectors for utility-scale and commercial solar projects.\n\nWe'd like to be considered as a supplier for your upcoming projects. Could you share your current requirements?\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193`,
  kenya:`Hello! This is from JunlinChicheng, a Chinese manufacturer of TUV & UL certified solar PV cables and MC4 connectors.\n\nWe supply off-grid and on-grid cable solutions to many African solar companies. We'd love to support your projects with competitive pricing. Can I send you our catalog?\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193\n📧 xxy13992859166@gmail.com`,
  india:`Hello! This is JunlinChicheng from China. We are a TUV and UL certified manufacturer of solar PV cables, MC4 connectors, and complete solar system components.\n\nWe would like to explore the opportunity to supply your project requirements. Could you share your current cable specifications and quantities?\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193\n📧 xxy13992859166@gmail.com`,
  brazil:`Hello! This is JunlinChicheng from China. We are a TUV and UL certified manufacturer of solar PV cables (PV1-F, H1Z2Z2-K) and MC4 connectors. We export to 50+ countries worldwide.\n\nWe'd like to discuss potential cooperation on your solar cable needs. Please let me know your requirements.\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193`,
  pakistan:`Hello! This is JunlinChicheng from China. We manufacture TUV & UL certified solar PV cables and MC4 connectors for utility-scale and commercial solar installations.\n\nWe have competitive pricing and flexible MOQ. Would you be open to discussing a supply partnership?\n\nBest regards,\n${COMPANY}\n📱 WhatsApp: +86 153 3900 5193\n📧 xxy13992859166@gmail.com`,
  custom:''
};

const targets=[
  {id:1,company:'Strandline Solar',country:'South Africa',type:'光伏EPC承包商',priority:'HIGH',phone:'',status:'pending',searchQ:'Strandline Solar South Africa contact phone WhatsApp procurement'},
  {id:2,company:'Red Energy South Africa',country:'South Africa',type:'光伏EPC',priority:'HIGH',phone:'',status:'pending',searchQ:'Red Energy South Africa contact phone WhatsApp procurement solar'},
  {id:3,company:'Sunsource Solar',country:'South Africa',type:'光伏EPC',priority:'HIGH',phone:'',status:'pending',searchQ:'Sunsource Solar South Africa contact phone procurement manager'},
  {id:4,company:'Transsolar Engineering',country:'Nigeria',type:'光伏EPC承包商（头部）',priority:'HIGH',phone:'',status:'pending',searchQ:'Transsolar Engineering Nigeria Lagos contact phone WhatsApp procurement'},
  {id:5,company:'LightUp Solar',country:'Nigeria',type:'离网光伏（大量采购电缆）',priority:'HIGH',phone:'',status:'pending',searchQ:'LightUp Solar Nigeria contact phone WhatsApp procurement manager'},
  {id:6,company:'ACWA Power',country:'Saudi Arabia',type:'公用事业级光伏（全球最大）',priority:'HIGH',phone:'',status:'pending',searchQ:'ACWA Power Saudi Arabia Riyadh procurement contact phone solar cables'},
  {id:7,company:'Falcon Energetics',country:'UAE',type:'光伏EPC',priority:'HIGH',phone:'',status:'pending',searchQ:'Falcon Energetics UAE Dubai contact phone procurement solar'},
  {id:8,company:'M-KOPA Solar',country:'Kenya',type:'离网光伏（大量采购电缆）',priority:'HIGH',phone:'',status:'pending',searchQ:'M-KOPA Solar Kenya Nairobi contact phone WhatsApp procurement'},
  {id:9,company:'Tata Power Renewable Energy',country:'India',type:'公用事业级光伏',priority:'HIGH',phone:'',status:'pending',searchQ:'Tata Power Renewable Energy India procurement vendor registration solar cables contact'},
  {id:10,company:'Waaree Energies',country:'India',type:'光伏组件+EPC',priority:'HIGH',phone:'',status:'pending',searchQ:'Waaree Energies India procurement contact phone solar cables'},
  {id:11,company:'Arnergy',country:'Nigeria',type:'分布式光伏解决方案',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Arnergy Nigeria Lagos contact phone WhatsApp solar'},
  {id:12,company:'Elm Company',country:'Saudi Arabia',type:'光伏EPC',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Elm Company Saudi Arabia contact phone procurement solar'},
  {id:13,company:'Karoon Energy',country:'UAE',type:'光伏EPC',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Karoon Energy UAE procurement contact phone solar cables'},
  {id:14,company:'Engie UAE',country:'UAE',type:'公用事业级光伏',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Engie UAE solar procurement contact phone'},
  {id:15,company:'OkoaSolar',country:'Kenya',type:'离网光伏',priority:'MEDIUM',phone:'',status:'pending',searchQ:'OkoaSolar Kenya contact phone WhatsApp procurement'},
  {id:16,company:'ReNew Power',country:'India',type:'公用事业级光伏',priority:'HIGH',phone:'',status:'pending',searchQ:'ReNew Power India procurement solar cables contact vendor registration'},
  {id:17,company:'Sika South Africa',country:'South Africa',type:'光伏EPC',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Sika South Africa solar procurement contact phone'},
  {id:18,company:'Maxtron Energy',country:'Nigeria',type:'光伏EPC+分销',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Maxtron Energy Nigeria contact phone procurement solar'},
  {id:19,company:'Ampenergy',country:'South Africa',type:'光伏EPC',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Ampenergy South Africa solar procurement contact'},
  {id:20,company:'Greenko Group',country:'India',type:'可再生能源',priority:'MEDIUM',phone:'',status:'pending',searchQ:'Greenko Group India solar procurement contact'},
];

let autoOpenInterval=null;
let currentIdx=0;

function getTemplate(country){
  const map={'South Africa':'south_africa','Nigeria':'nigeria','Saudi Arabia':'saudi','UAE':'uae','Kenya':'kenya','India':'india','Brazil':'brazil','Pakistan':'pakistan'};
  return TEMPLATES[map[country]||'south_africa'];
}

function updateTemplate(){
  const sel=document.getElementById('templateSelect').value;
  const custom=document.getElementById('customTemplate');
  const preview=document.getElementById('templatePreview');
  if(sel==='custom'){custom.style.display='block';preview.textContent=custom.value||'请输入自定义消息...';custom.oninput=()=>preview.textContent=custom.value;}
  else{custom.style.display='none';preview.textContent=TEMPLATES[sel]||'';}
}

function renderTargets(){
  const tbody=document.getElementById('targetBody');
  tbody.innerHTML=targets.map((t,i)=>`
    <tr id="row-${t.id}">
      <td><strong>${t.company}</strong></td>
      <td>${t.country}</td>
      <td style="font-size:12px;color:#94a3b8">${t.type}</td>
      <td><span class="priority-${t.priority.toLowerCase()}">${t.priority}</span></td>
      <td><input class="phone-input" id="phone-${t.id}" placeholder="+国际号码" value="${t.phone}" onchange="savePhone(${t.id},this.value)"></td>
      <td><button class="btn-search" onclick="searchCompany(${i})">🔍 搜索</button></td>
      <td><button class="btn-wa" onclick="sendWhatsApp(${i})" ${!t.phone?'disabled':''}>💬 WhatsApp</button></td>
      <td><span class="status-${t.status}">${t.status==='pending'?'待开发':t.status==='open'?'已打开':'已发送'}</span></td>
    </tr>
  `).join('');
  document.getElementById('phoneCount').textContent=targets.filter(t=>t.phone).length;
  document.getElementById('openCount').textContent=targets.filter(t=>t.status==='open'||t.status==='sent').length;
  document.getElementById('sentCount').textContent=targets.filter(t=>t.status==='sent').length;
}

function savePhone(id,val){
  const t=targets.find(x=>x.id===id);
  if(t){t.phone=val.replace(/[^0-9+]/g,'');renderTargets();}
}

function searchCompany(idx){
  const t=targets[idx];
  window.open('https://www.google.com/search?q='+encodeURIComponent(t.searchQ),'_blank');
  t.status='open';
  renderTargets();
  addLog('Opened search for '+t.company);
}

function sendWhatsApp(idx){
  const t=targets[idx];
  if(!t.phone){alert('请先填写 WhatsApp 号码（含国家代码，如 +27xxx 或 234xxx）');return;}
  let phone=t.phone.replace(/[\s\-\(\)]/g,'');
  if(phone.startsWith('+'))phone=phone.slice(1);
  const sel=document.getElementById('templateSelect').value;
  let msg=sel==='custom'?document.getElementById('customTemplate').value:getTemplate(t.country);
  if(sel==='custom'&&msg===''){alert('请先选择模板或输入自定义消息');return;}
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  t.status='sent';
  renderTargets();
  addLog('Sent WhatsApp to '+t.company+' ('+phone+')');
}

function openAllSearches(){
  targets.forEach((t,i)=>{
    setTimeout(()=>searchCompany(i),i*800);
  });
  addLog('Opened all '+targets.length+' search tabs');
}

function startAutoOpen(){
  if(autoOpenInterval)return;
  currentIdx=0;
  document.getElementById('autoOpenBtn').disabled=true;
  addLog('Starting auto open sequence...');
  autoOpenInterval=setInterval(()=>{
    if(currentIdx>=targets.length){
      clearInterval(autoOpenInterval);
      autoOpenInterval=null;
      document.getElementById('autoOpenBtn').disabled=false;
      document.getElementById('barStatus').textContent='✅ 全部搜索完毕！请查看结果并填写手机号。';
      return;
    }
    const t=targets[currentIdx];
    searchCompany(currentIdx);
    const pct=Math.round((currentIdx+1)/targets.length*100);
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('barStatus').textContent='正在搜索: '+t.company+' ('+(currentIdx+1)+'/'+targets.length+')';
    addLog('['+(currentIdx+1)+'/'+targets.length+'] '+t.company);
    currentIdx++;
  },3000);
}

function exportContacts(){
  const withPhone=targets.filter(t=>t.phone);
  if(withPhone.length===0){alert('还没有填写任何电话号码！请先搜索并填写。');return;}
  let csv='Company,Country,Type,Priority,Phone,WhatsApp Link\n';
  withPhone.forEach(t=>{
    let phone=t.phone.replace(/[^0-9+]/g,'');
    if(phone.startsWith('+'))phone=phone.slice(1);
    const msg=encodeURIComponent(getTemplate(t.country));
    csv+=`"${t.company}","${t.country}","${t.type}","${t.priority}","${t.phone}","https://wa.me/${phone}?text=${msg}"\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='junlinchicheng-whatsapp-contacts.csv';
  a.click();
  addLog('Exported '+withPhone.length+' contacts to CSV');
}

function addLog(msg){
  const log=document.getElementById('log');
  const time=new Date().toLocaleTimeString();
  log.innerHTML+=`<div class="log-entry log-ok">[${time}] ${msg}</div>`;
  log.scrollTop=log.scrollHeight;
}

renderTargets();
updateTemplate();
</script>
</body>
</html>
