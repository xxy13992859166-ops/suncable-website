name: cleanup-junk
on:
  push:
    paths:
      - '.github/workflows/cleanup-junk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete backslash-named duplicate assets
        run: |
          set -u
          git config core.quotepath false
          echo "--- before ---"
          git ls-files | grep '\\' || echo "(none)"
          removed=0
          for f in \
            'images\combiner.svg' \
            'images\inverter.svg' \
            'images\junctionbox.svg' \
            'images\microinverter.svg' \
            'images\module.svg' \
            'images\rail.svg' ; do
            if [ -e "$f" ]; then
              git rm -f -- "$f" && removed=$((removed+1))
            fi
          done
          echo "removed=$removed"
          echo "--- sweep any remaining backslash paths ---"
          git ls-files | grep '\\' | while read -r p; do git rm -f -- "$p"; done || true
          echo "--- after ---"
          git ls-files | grep '\\' || echo "(none)"
          echo "--- real svgs kept ---"
          git ls-files 'images/*.svg' | while read -r p; do
            echo "$p $(stat -c %s "$p")"
          done
      - name: Remove this workflow and commit
        run: |
          git rm -f .github/workflows/cleanup-junk.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: delete backslash-named duplicate SVG assets"
            git push
          fi
