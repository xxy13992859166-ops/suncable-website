name: inject-inquiry-form
on:
  push:
    paths:
      - '.github/workflows/inject-inquiry-form.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inject_inquiry_form.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'Inject inquiry form across product and country pages' && git push; fi
