name: seo-batch2
on:
  push:
    paths:
      - '.github/workflows/seo-batch2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply title, description and H1 batch
        run: python3 tools/seo_batch2.py --apply
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "SEO batch 2: shorten titles and descriptions, fix duplicate H1, index site-map link"
            git push
          fi
