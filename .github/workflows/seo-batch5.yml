name: seo-batch5
on:
  push:
    paths:
      - '.github/workflows/seo-batch5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix og:image, add social cards and breadcrumbs, register markets page
        run: python3 tools/seo_batch5.py --apply
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "SEO batch 5: repair og:image, add Open Graph and breadcrumbs, publish export markets page"
            git push
          fi
