name: fix-base-path
on:
  push:
    paths:
      - '.github/workflows/fix-base-path.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_base_path.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'Fix base path: prefix root-absolute links with /suncable-website' && git push; fi
