name: seo-batch10
on:
  push:
    paths:
      - 'tools/seo_batch10.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-batch10
  cancel-in-progress: false
jobs:
  batch10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add webmail compose routes
        run: |
          if [ ! -f tools/seo_batch10.py ]; then
            echo "script not present, nothing to do"
            exit 0
          fi
          python tools/seo_batch10.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Inquiry panel: add Gmail and Outlook web compose routes"
            git push
          fi
