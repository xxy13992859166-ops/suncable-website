name: gen-product-pages
on:
  push:
    paths:
      - '.github/workflows/gen-product-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_product_pages.py
      - run: python3 tools/inject_inquiry_form.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'Add storage, AC and combiner product pages' && git push; fi
