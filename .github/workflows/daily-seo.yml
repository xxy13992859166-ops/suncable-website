name: daily-seo
on:
  push:
    paths:
      - '.github/workflows/daily-seo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run daily SEO batch
        run: python3 tools/daily_seo.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Daily SEO: fix broken contact link, add site map page"
            git push
          fi
